<!DOCTYPE html>
<html>
<head>
    <title>Student Profile</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:linear-gradient(135deg,#ff9a9e,#fad0c4);
        }

        .card{
            width:320px;
            margin:80px auto;
            background:#ffffff;
            padding:25px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
        }

        .avatar{
            width:100px;
            height:100px;
            border-radius:50%;
            object-fit:cover;
            display:block;
            margin:auto;
        }

        h2{
            color:black;
        }

        p{
            color:black;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
function App(){
    return(
        <div className="card">
            <img
                src="walsh.jpg.jpeg" 
                alt="Student" 
                className="avatar"
            />
            <h2>A.Walsh Jeslin</h2>
            <p>BCA</p>
            <p>Roll No:48</p>
            <p>College:Kamaraj College</p>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
