<!DOCTYPE html> 
<html> 
<head> 
    <title>Digital Clock</title> 
    <style> 
        body{ 
            font-family:"Times New Roman"; 
            background:#222; 
            display:flex; 
            justify-content:center;  
            height:100vh; 
            color:white; 
        } 
 
        .clock{ 
            background:black; 
            padding:20px 40px; 
            border-radius:10px; 
            box-shadow:0px 0px 20px cyan; 
            font-size:40px; 
            letter-spacing:3px; 
        } 

        h1{ 
            text-align:center; 
            
            } 
    </style> 
    <script> 
    function showTime(){ 
        let date=new Date(); 
        let h=date.getHours(); 
        let m=date.getMinutes(); 
        let s=date.getSeconds();
        let time=h+":"+m+":"+s; 
        document.getElementById("clock").innerHTML=time; 
    } 
    setInterval(showTime,1000); 
    </script> 
</head> 
<body onload="showTime()"> 
    <div> 
        <h1>Digital Clock</h1> 
        <div class="clock" id="clock"></div> 
    </div> 
</body> 
</html>
