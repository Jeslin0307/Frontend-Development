<!DOCTYPE html>
<html>
<head>
    <title>Event</title>

    <style>
        body{
            text-align:center;
            background:pink;
            font-family:'Times New Roman';
        }

        button,input{
            padding:10px;
            margin:5px;
            background:white;
        }

        #msg{
            color:blue;
            font-size:25px;
        }
    </style>

    <script>
        function show(){
            document.getElementById("msg").innerHTML="Button Clicked!";
        }

        function color(c){
            document.body.style.background=c;
        }

        function doubleClick(){
            document.getElementById("msg").innerHTML="Double Clicked!";
        }

        function typing(){
            document.getElementById("msg").innerHTML="Typing...";
        }

        function changeText(){
            document.getElementById("msg").innerHTML="Option Changed!";
        }
    </script>
</head>

<body>

    <h1>Event Handling</h1>

    <button onclick="show()">Click</button>

    <button onmouseover="color('palevioletred')" 
            onmouseout="color('pink')">
        Hover
    </button>

    <button ondblclick="doubleClick()">Double Click</button>

    <br><br>

    <input type="text" onkeyup="typing()" placeholder="Type here">

    <select onchange="changeText()">
        <option>BCA</option>
        <option>BBA</option>
        <option>B.Com</option>
    </select>

    <p id="msg"></p>

</body>
</html>
