<!DOCTYPE html>
<html>
<head>
    <title>Colorful Webpage</title>

    <style>
        body{
            margin:0;
            font-family:Arial;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,pink,peachpuff,mediumpurple);
        }

        .box{
            background:white;
            padding:40px;
            text-align:center;
            border-radius:20px;
            width:300px;
            box-shadow:0 5px 15px gray;
        }

        h1{
            color:purple;
        }

        p{
            color:dimgray;
        }

        button{
            padding:10px 20px;
            border:none;
            border-radius:25px;
            background:deeppink;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:purple;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Welcome</h1>
        <p>This is a simple colorful webpage using HTML & CSS.</p>
        <button>Explore</button>
    </div>

</body>
</html>
